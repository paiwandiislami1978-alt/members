<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خوێندنەوەی وێنەی ئەندامان</title>
<style>
body{margin:0;background:#0f1720;color:#eef3f7;font:18px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{max-width:560px;width:100%;text-align:center}
h1{font-size:26px;margin:0 0 10px}
label{display:block;background:#facc15;color:#111;font-size:24px;font-weight:800;padding:28px;border-radius:18px;cursor:pointer;margin:24px 0}
label.off{opacity:.4;pointer-events:none}
#msg{font-size:20px;min-height:60px}
progress{width:100%;height:18px}
.ok{color:#4ade80;font-weight:800}
</style>
</head>
<body>
<div class="box">
  <h1>خوێندنەوەی وێنەی ئەندامان</h1>
  <div id="msg">چاوەڕێ بکە… بەرنامەکە باردەبێت</div>
  <label id="pick" class="off" for="f">📂 کلیک لێرە بکە و فایلی<br>endamekan-kongre13.json<br>هەڵبژێرە</label>
  <input id="f" type="file" style="display:none">
  <progress id="p" value="0" max="1" style="display:none"></progress>
</div>
<script>
(async () => {
const $ = id => document.getElementById(id), msg = t => $('msg').innerHTML = t;
const BASES = ['https://paiwandiislami1978-alt.github.io/face-api/', 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/'];
let base = null;
for (const b of BASES) {
  await new Promise(res => { const s = document.createElement('script'); s.src = b + 'dist/face-api.js'; s.onload = s.onerror = res; document.head.appendChild(s); });
  if (typeof faceapi !== 'undefined') { base = b; break; }
}
if (!base) { msg('❌ بەرنامە بارنەبوو. ئینتەرنێت بپشکنە و پەڕەکە نوێ بکەرەوە.'); return; }
await faceapi.tf.setBackend('webgl').catch(() => {});
await faceapi.tf.ready();
const M = base + 'model/';
await faceapi.nets.ssdMobilenetv1.loadFromUri(M);
await faceapi.nets.faceLandmark68Net.loadFromUri(M);
await faceapi.nets.faceRecognitionNet.loadFromUri(M);
msg('✓ ئامادەیە. کلیک لە دوگمە زەردەکە بکە.');
$('pick').classList.remove('off');

const toCanvas = src => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => { const s = Math.min(1, 800 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c); };
  img.onerror = rej; img.src = src;
});
$('f').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  $('pick').classList.add('off');
  let data;
  try { data = JSON.parse(await file.text()); } catch { msg('❌ ئەم فایلە دروست نییە. فایلی endamekan-kongre13.json هەڵبژێرە.'); $('pick').classList.remove('off'); return; }
  if (!data || data.type !== 'members-photos-v1') { msg('❌ ئەمە فایلی ئەندامان نییە. فایلی endamekan-kongre13.json هەڵبژێرە.'); $('pick').classList.remove('off'); return; }
  const list = data.members, out = [], fails = [];
  $('p').style.display = 'block'; $('p').max = list.length;
  for (let i = 0; i < list.length; i++) {
    const m = list[i];
    $('p').value = i; msg(`دەخوێندرێتەوە… ${i + 1} / ${list.length}<br><small>${m.name.replace(/</g, '')}</small>`);
    let d = null;
    try { const det = await faceapi.detectSingleFace(await toCanvas(m.photo), new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 })).withFaceLandmarks().withFaceDescriptor(); if (det) d = det.descriptor; } catch {}
    let q = null, s = 0;
    if (d) { s = Math.max(...Array.from(d, Math.abs)) || 1; let bin = ''; for (const v of d) bin += String.fromCharCode(Math.round(v / s * 127) & 255); q = btoa(bin); }
    else fails.push(m.name);
    out.push({ n: m.name, g: m.group, d: q, s: +s.toFixed(6) });
    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
  }
  $('p').value = list.length;
  const blob = new Blob([JSON.stringify({ type: 'members-built-v1', version: faceapi.version, members: out })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'members-built.json';
  document.body.appendChild(a); a.click();
  msg(`<span class="ok">✓ تەواو!</span><br>${out.length - fails.length} ئەندام خوێندرانەوە.<br>فایلی <b>members-built.json</b> لە Downloads پاشەکەوت کرا.<br>ئێستا لە Claude بنووسە «تەواو».`);
};
})();
</script>
</body>
</html>
